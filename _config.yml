title: SAGE Bewley
author: Alessandro Conway
copyright: "2026"
only_build_toc_files: true
exclude_patterns: [.venv, _build, "**.ipynb_checkpoints", .DS_Store, Thumbs.db]

execute:
  execute_notebooks: cache
  timeout: 600
  allow_errors: false

parse:
  myst_enable_extensions:
    - amsmath
    - dollarmath
    - colon_fence

repository:
  url: https://github.com/conway1521/sage-bewley

html:
  use_repository_button: true
  use_issues_button: false
  home_page_in_navbar: false

sphinx:
  config:
    html_title: "SAGE Bewley"
    mathjax_path: https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
    html_theme_options:
      show_navbar_depth: 1
      repository_url: https://github.com/conway1521/sage-bewley
      use_repository_button: true
